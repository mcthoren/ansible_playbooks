# vim:set tabstop=2 softtabstop=2 shiftwidth=2 expandtab:
---
- hosts: boincs
  gather_facts: no
  user: root

  tasks:

  - name: add boinc package
    apt:
      name: boinc-client
      state: present
    when: ansible_facts['os_family'] == 'Debian'
    tags:
      - packages
      - boinc

  - name: enable and start boinc-client
    service:
      name: boinc-client
      state: started
      enabled: yes
    when: ansible_facts['os_family'] == 'Debian'
    tags:
      - boinc
